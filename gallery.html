<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Rish Verse</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="progress-bar"></div>
    <div class="page-transition"></div>

    <!-- PREMIUM MINIMALIST ENTRY LOADER -->
    <div class="loader">
        <div class="loader-content">
            <img src="images/logo.png" alt="Logo" class="loader-logo">
            <h1>Exposition</h1>
            <span class="loader-accent"></span>
        </div>
    </div>

    <!-- ASYMMETRIC LOOKBOOK NAVIGATION (FIXED LEFT PANEL) -->
    <aside class="side-panel">
        <div class="panel-header">
            <a href="index.html" class="brand-link">
                <img src="images/logo.png" class="nav-logo" alt="Rish Verse Logo">
                <h1>Rish Verse</h1>
            </a>
            <p class="tagline">Bring Creativity to life</p>
        </div>

        <nav class="vertical-nav">
            <ul class="nav-links">
                <li><a href="index.html" data-num="01">Home</a></li>
                <li><a href="gallery.html" class="active" data-num="02">Gallery</a></li>
                <li><a href="poems.html" data-num="03">Poems</a></li>
                <li><a href="thecrypt.html" data-num="04">The Crypt</a></li>
            </ul>
        </nav>

        <div class="panel-footer">
            <p>© 2026 Archive</p>
        </div>
    </aside>

    <!-- FINE-ART EXPOSITION CANVAS (SCROLLING RIGHT SIDE) -->
    <main class="main-content">
        
        <header class="gallery-intro">
            <p class="section-meta">Portfolio / Visual Data</p>
            <h1>Captured Moments</h1>
            <p class="gallery-subtitle">A borderless array of environmental framing and raw focal depth.</p>
        </header>

        <!-- PURE BORDERLESS IMAGE MATRIX -->
        <section class="gallery-exposition-area">
            <div class="masonry-gallery" id="galleryGridMatrix">
                
                <!-- Visible Batch (First 9 Images) -->
                <div class="gallery-card">
                    <img src="images/i1.jpg" alt="Artwork 1">
                </div>
                <div class="gallery-card">
                    <img src="images/i2.jpg" alt="Artwork 2">
                </div>
                <div class="gallery-card">
                    <img src="images/i3.jpg" alt="Artwork 3">
                </div>
                <div class="gallery-card">
                    <img src="images/i4.jpg" alt="Artwork 4">
                </div>
                <div class="gallery-card">
                    <img src="images/i5.jpg" alt="Artwork 5">
                </div>
                <div class="gallery-card">
                    <img src="images/i6.jpg" alt="Artwork 6">
                </div>
                <div class="gallery-card">
                    <img src="images/i7.jpg" alt="Artwork 7">
                </div>
                <div class="gallery-card">
                    <img src="images/i8.jpg" alt="Artwork 8">
                </div>
                <div class="gallery-card">
                    <img src="images/i9.jpg" alt="Artwork 9">
                </div>
                <div class="gallery-card">
                    <img src="images/i10.jpg" alt="Artwork 10">
                </div>
                <div class="gallery-card">
                    <img src="images/i11.jpg" alt="Artwork 11">
                </div>
                <div class="gallery-card">
                    <img src="images/i12.jpg" alt="Artwork 12">
                </div>
                <div class="gallery-card">
                    <img src="images/i13.jpg" alt="Artwork 13">
                </div>
                <div class="gallery-card">
                    <img src="images/i14.jpg" alt="Artwork 14">
                </div>
                <div class="gallery-card">
                    <img src="images/i15.jpg" alt="Artwork 15">
                </div>

                <!-- Hidden Segments (Loaded via Script Engine) -->
                <div class="gallery-card initial-hidden">
                    <img src="images/i10.jpg" alt="Artwork 10">
                </div>
                <!-- Add extra image nodes here using this exact 'initial-hidden' structure if needed -->

            </div>

            <!-- GHOST LOAD ACTION CONTROL BUTTON -->
            <div class="load-more-container" id="galleryLoadBtnWrapper">
                <button class="load-more-btn" id="galleryLoadMoreTrigger">Load More Artifacts</button>
            </div>
        </section>

        <footer class="canvas-footer">
            <p>Rish Verse Visuals • All Rights Reserved</p>
        </footer>
    </main>

    <!-- IMMERSIVE DUAL-PANEL LIGHTBOX CANVAS -->
    <div class="lightbox" id="masterSocialLightbox">
        <button class="close-lightbox" id="closeLightboxWidget">×</button>
        
        <!-- Flanking Viewport Navigation controls -->
        <button class="lightbox-nav-btn prev-btn" id="galleryPrevBtn">‹</button>
        <button class="lightbox-nav-btn next-btn" id="galleryNextBtn">›</button>

        <div class="lightbox-split-container">
            <!-- Left Side: Core Art Viewer Canvas Frame -->
            <div class="lightbox-art-pane" id="lightboxArtPane">
                <img src="" alt="Enlarged View" class="lightbox-image" id="lightboxTargetViewImage">
            </div>

            <!-- Right Side: Translucent Social Comments / Likes Ledger -->
            <div class="lightbox-social-pane">
                <div class="social-engagement-header">
                    <div class="like-action-wrapper">
                        <button class="like-btn" id="galleryLikeBtn">♥</button>
                        <span class="like-counter-text"><span id="likeCountLabel">0</span> Appreciations</span>
                    </div>
                </div>

                <!-- Scrolling Live Response Stream Container -->
                <div class="comments-feed-scroll" id="galleryCommentsBox"></div>

                <!-- Input Entry Submission Area -->
                <div class="social-submit-footer">
                    <form id="galleryReviewForm" class="gallery-input-form">
                        <input type="text" id="galleryNameField" placeholder="Identity / Anonymous">
                        <textarea id="galleryTextField" placeholder="Record your impression or thought..." required></textarea>
                        <button type="submit" class="gallery-submit-btn">Transmit Thought</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST ALERTS OVERLAY TERMINAL -->
    <div id="toast-container"></div>

  <script type="module" src="script.js"></script>
    <script type="module" src="database.js"></script>
</body>
</html>
