    <!-- GALLERY HERO -->

    <section class="gallery-hero">

        <div class="gallery-overlay"></div>

            </p>

            <h2>
                Fragments of silence,<br>
                captured through motion.
            </h2>

        </div>

    </section>



    <!-- GALLERY SECTION -->

    <section class="gallery-section">

        <div class="masonry-gallery">

            <img src="images/i1.jpg" alt="">
            <img src="images/i2.jpg" alt="">
            <img src="images/i3.jpg" alt="">
            <img src="images/i4.jpg" alt="">
            <img src="images/i5.jpg" alt="">
            <img src="images/i6.jpg" alt="">
            <img src="images/i7.jpg" alt="">

    <!-- LIGHTBOX -->

   <div class="lightbox">
    <span class="close-lightbox">&times;</span>
    
    <div class="lightbox-wrapper">
        <div class="lightbox-media-side">
            <img class="lightbox-image" src="" alt="Cinematic Frame">
        </div>
        
        <div class="lightbox-interactive-side">
            <div class="review-container modal-reviews">
                <h2>Frame Echo</h2>
                <p class="review-subtext">Leave a thought on this specific capture.</p>

                <div class="star-rating modal-stars">
                    <span data-rating="1">★</span>
                    <span data-rating="2">★</span>
                    <span data-rating="3">★</span>
                    <span data-rating="4">★</span>
                    <span data-rating="5">★</span>
                </div>

                <form id="reviewForm" class="modal-form">
                    <input type="text" id="reviewName" placeholder="Your name (optional)">
                    <textarea id="reviewText" placeholder="Share your perspective..." required></textarea>
                    <button type="submit">Submit Echo</button>
                </form>

                <div id="reviewsContainer" class="modal-feed"></div>
            </div>
        </div>
    </div>
  </div>

  <script>
    window.addEventListener("pageshow", function (event) {
        if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
            window.location.reload();
        }
    });
</script>
