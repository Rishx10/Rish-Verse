<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Crypt // Rish Verse</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ==========================================================================
           SYSTEM-WIDE CRYPT OVERHAUL STYLING
           ========================================================================== */
        .crypt-container {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            gap: 40px;
            min-height: calc(100vh - 150px);
        }

        .matrix-box {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .crypt-grid {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 8px;
        }

        .crypt-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        /* Error Feedback Shake Animation */
        .crypt-row.shake {
            animation: shakeRow 0.4s ease-in-out;
        }

        .crypt-tile {
            width: 60px;
            height: 60px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.02);
            color: #fff;
            font-size: 1.5rem;
            font-weight: 300;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
            position: relative;
            transition: all 0.2s ease;
        }

        /* Sleek Pulsing Input Cursor */
        .crypt-tile.active-cursor {
            border-bottom: 3px solid #7d8f7a !important;
            animation: pulseCursor 1.2s infinite ease-in-out;
        }

        .interaction-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 25px;
            max-width: 480px;
        }

        .virtual-keyboard {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .kb-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            width: 100%;
        }

        .kb-key {
            flex: 1;
            height: 50px;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: #fff;
            font-size: 0.95rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s ease;
            border-radius: 4px;
        }

        .kb-key:active {
            background: rgba(255, 255, 255, 0.15);
        }

        .kb-key.wide {
            flex: 1.5;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        /* ==========================================================================
           RESPONSIVE MOBILE SCALING MEDIA ENGINE
           ========================================================================== */
        @media (max-width: 900px) {
            .crypt-container {
                flex-direction: column;
                padding: 20px 10px;
                gap: 30px;
                justify-content: center;
            }
            
            .interaction-panel {
                max-width: 100%;
                width: 100%;
            }

            .crypt-tile {
                width: 50px;
                height: 50px;
                font-size: 1.3rem;
            }

            .kb-key {
                height: 45px;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 400px) {
            .crypt-container {
                padding: 10px 5px;
                gap: 20px;
            }

            .crypt-tile {
                width: 44px;
                height: 44px;
                font-size: 1.1rem;
            }

            .kb-row {
                gap: 4px;
            }

            .kb-key {
                height: 40px;
                font-size: 0.75rem;
            }

            .kb-key.wide {
                font-size: 0.65rem;
            }
        }

        /* ==========================================================================
           ANIMATIONS KEYFRAMES
           ========================================================================== */
        @keyframes pulseCursor {
            0%, 100% { border-bottom-color: rgba(125, 143, 122, 0.2); }
            50% { border-bottom-color: rgba(125, 143, 122, 1); }
        }

        @keyframes shakeRow {
            0%, 100% { transform: translateX(0); }
            15%, 45%, 75% { transform: translateX(-6px); }
            30%, 60%, 90% { transform: translateX(6px); }
        }
    </style>
</head>
<body class="crypt-page">
    <div class="page-transition"></div>
    
    <div style="display: flex; min-height: 100vh;">
        <aside style="width: 280px; padding: 40px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid rgba(255,255,255,0.05);" class="sidebar-nav-frame">
            <div>
                <div class="logo-frame" style="margin-bottom: 40px;">
                    <span style="font-size: 1.8rem; font-weight: 300; letter-spacing: 2px; color: #fff;">Rish Verse</span>
                </div>
                <nav style="display: flex; flex-direction: column; gap: 20px;">
                    <a href="index.html" style="color: rgba(255,255,255,0.4); text-decoration: none;">01 Home</a>
                    <a href="gallery.html" style="color: rgba(255,255,255,0.4); text-decoration: none;">02 Gallery</a>
                    <a href="poems.html" style="color: rgba(255,255,255,0.4); text-decoration: none;">03 Poems</a>
                    <a href="thecrypt.html" style="color: #fff; text-decoration: none; font-weight: 400;">04 The Crypt</a>
                </nav>
            </div>
            <footer style="font-size: 0.8rem; color: rgba(255,255,255,0.2);">&copy; 2026 Archive</footer>
        </aside>

        <main style="flex: 1; background: #0a0a0a;">
            <div class="crypt-container">
                
                <div class="matrix-box">
                    <div class="crypt-grid" id="cryptGrid">
                        </div>
                </div>

                <div class="interaction-panel">
                    <div>
                        <span style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: #7d8f7a;">— MODULE / LOGIC ENGINE</span>
                        <h1 style="font-size: 3rem; font-weight: 300; margin: 10px 0; color: #fff;">The Crypt</h1>
                        <p style="color: rgba(255,255,255,0.4); margin: 0;">Decipher the fading poetry fragments.</p>
                    </div>

                    <div style="font-style: italic; font-size: 0.9rem; color: rgba(255,255,255,0.3); padding: 15px; background: rgba(255,255,255,0.01); border-left: 2px solid #7d8f7a;" id="gamePromptLabel">
                        The vault parameters hum quietly... type your initial guess.
                    </div>

                    <div class="virtual-keyboard">
                        <div class="kb-row">
                            <button class="kb-key" data-key="Q">q</button>
                            <button class="kb-key" data-key="W">w</button>
                            <button class="kb-key" data-key="E">e</button>
                            <button class="kb-key" data-key="R">r</button>
                            <button class="kb-key" data-key="T">t</button>
                            <button class="kb-key" data-key="Y">y</button>
                            <button class="kb-key" data-key="U">u</button>
                            <button class="kb-key" data-key="I">i</button>
                            <button class="kb-key" data-key="O">o</button>
                            <button class="kb-key" data-key="P">p</button>
                        </div>
                        <div class="kb-row">
                            <button class="kb-key" data-key="A">a</button>
                            <button class="kb-key" data-key="S">s</button>
                            <button class="kb-key" data-key="D">d</button>
                            <button class="kb-key" data-key="F">f</button>
                            <button class="kb-key" data-key="G">g</button>
                            <button class="kb-key" data-key="H">h</button>
                            <button class="kb-key" data-key="J">j</button>
                            <button class="kb-key" data-key="K">k</button>
                            <button class="kb-key" data-key="L">l</button>
                        </div>
                        <div class="kb-row">
                            <button class="kb-key wide" data-key="ENTER">ENTER</button>
                            <button class="kb-key" data-key="Z">z</button>
                            <button class="kb-key" data-key="X">x</button>
                            <button class="kb-key" data-key="C">c</button>
                            <button class="kb-key" data-key="V">v</button>
                            <button class="kb-key" data-key="B">b</button>
                            <button class="kb-key" data-key="N">n</button>
                            <button class="kb-key" data-key="M">m</button>
                            <button class="kb-key wide" data-key="DELETE">DELETE</button>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <div id="toast-container"></div>

    <script type="module" src="script.js"></script>
    <script type="module" src="database.js"></script>
</body>
</html>
